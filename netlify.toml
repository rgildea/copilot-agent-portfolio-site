[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# Cache static assets for better performance
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000" # Cache images for 1 year

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000" # Cache CSS for 1 year

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000" # Cache JS for 1 year

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000" # Cache fonts for 1 year

[dev]
  command = "npm run dev"
  port = 8080
  publish = "_site"

# Enable Netlify CMS proxy server for local development
[[plugins]]
  package = "@netlify/plugin-local-install-core"