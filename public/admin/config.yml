backend:
  name: github
  repo: rgildea/copilot-agent-portfolio-site
  branch: main

media_folder: "public/images/portfolio"
public_folder: "/images/portfolio"

collections:
  - name: "portfolio"
    label: "Portfolio Item"
    folder: "src/content/portfolio"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Role", name: "role", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "URL", name: "url", widget: "string", hint: "External link" }
      - { label: "Client", name: "client", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "markdown" }
      - {
          label: "Featured",
          name: "featured",
          widget: "boolean",
          default: false,
        }
      - { label: "Order", name: "order", widget: "number", default: 10 }
      # Keep in sync with audioTracks schema in src/content/config.ts
      - label: "Audio Tracks"
        name: "audioTracks"
        widget: "list"
        required: false
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Rough Mix URL", name: "roughUrl", widget: "string" }
          - { label: "Final Mix URL", name: "finalUrl", widget: "string" }
          - {
              label: "Rough Offset (ms)",
              name: "roughOffset",
              widget: "number",
              default: 0,
              required: false,
              hint: "Negative: skip start of rough file. Positive: add silence before rough playback.",
            }
          - {
              label: "Rough Gain (dB)",
              name: "roughGain",
              widget: "number",
              value_type: "float",
              default: 0,
              required: false,
              min: -60,
              max: 12,
              step: 0.1,
              hint: "Gain in dB applied to the rough mix player. Negative to attenuate, positive to boost.",
            }
          - {
              label: "Final Gain (dB)",
              name: "finalGain",
              widget: "number",
              value_type: "float",
              default: 0,
              required: false,
              min: -60,
              max: 12,
              step: 0.1,
              hint: "Gain in dB applied to the final mix player. Negative to attenuate, positive to boost.",
            }

  - name: "services"
    label: "Service"
    folder: "src/content/services"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Icon",
          name: "icon",
          widget: "string",
          hint: "Font Awesome icon class (e.g. fa-music)",
        }
      - { label: "Intro", name: "intro", widget: "text" }
      - label: "Bullets"
        name: "bullets"
        widget: "list"
        required: false
        field: { label: "Bullet", name: "bullet", widget: "string" }
      - { label: "Order", name: "order", widget: "number", default: 10 }

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Hero"
        name: "hero"
        file: "src/data/hero.json"
        fields:
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Sub-headline", name: "subheadline", widget: "text" }

      - label: "Services Section"
        name: "services-section"
        file: "src/data/services-section.json"
        fields:
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Sub-headline", name: "subheadline", widget: "text" }
          - {
              label: "Show In Nav",
              name: "showInNav",
              widget: "boolean",
              default: true,
            }
          - { label: "Nav Label", name: "navLabel", widget: "string" }

      - label: "Process Section"
        name: "process"
        file: "src/data/process.json"
        fields:
          - { label: "Headline", name: "headline", widget: "string" }
          - {
              label: "Show In Nav",
              name: "showInNav",
              widget: "boolean",
              default: true,
            }
          - { label: "Nav Label", name: "navLabel", widget: "string" }
          - label: "Steps"
            name: "steps"
            widget: "list"
            fields:
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

      - label: "About Information"
        name: "about"
        file: "src/data/about.json"
        fields:
          - { label: "Bio", name: "bio", widget: "markdown" }
          - label: "Skills"
            name: "skills"
            widget: "list"
            field: { label: "Skill", name: "skill", widget: "string" }

      - label: "Contact Information"
        name: "contact"
        file: "src/data/contact.json"
        fields:
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Location", name: "location", widget: "string" }
          - label: "Social Links"
            name: "socialLinks"
            widget: "list"
            fields:
              - { label: "Platform", name: "platform", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - {
                  label: "Icon",
                  name: "icon",
                  widget: "string",
                  hint: "Font Awesome class (e.g. fa-linkedin)",
                }
